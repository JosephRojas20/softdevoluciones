<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M12 3 21 8v8l-9 5-9-5V8l9-5Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path
            d="m3 8 9 5 9-5M12 13v8"
            stroke="currentColor"
            stroke-width="1.8"
          />
        </svg>
      </div>

      <div>
        <span class="brand-name">SoftDevoluciones</span>
        <p class="brand-description">
          Sistema de gestión de devoluciones
        </p>
      </div>
    </header>

    <div class="heading">
      <h1 id="login-title">Iniciar sesión</h1>
      <p>Ingresa con tu cuenta para continuar</p>
    </div>

    <form #formulario="ngForm" (ngSubmit)="ingresar()">
      <div class="field">
        <label for="email">Correo electrónico</label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          email
          autocomplete="username"
          placeholder="cliente@correo.com"
          [disabled]="cargando()"
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>

        <div class="password-field">
          <input
            id="password"
            name="password"
            [type]="mostrarPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
            placeholder="Ingresa tu contraseña"
            [disabled]="cargando()"
          />

          <button
            class="visibility-button"
            type="button"
            (click)="mostrarPassword.set(!mostrarPassword())"
            [attr.aria-label]="
              mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'
            "
            [attr.aria-pressed]="mostrarPassword()"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <circle
                cx="12"
                cy="12"
                r="3"
                stroke="currentColor"
                stroke-width="1.8"
              />
            </svg>
          </button>
        </div>
      </div>

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button
        class="primary-button"
        type="submit"
        [disabled]="formulario.invalid || cargando()"
      >
        {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <footer class="card-footer">
      Devoluciones simples, rápidas y transparentes.
    </footer>
  </section>
</main>
